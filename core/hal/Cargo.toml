[package]
name = "fontis-hal"
version = "0.1.0"
edition = "2021"
description = "Fontis Hardware Abstraction Layer"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
hwtest = []

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
