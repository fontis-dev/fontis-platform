#@TYPE: Machine
#@NAME: Fontis Device
#@DESCRIPTION: Machine configuration for the Fontis household device (x86-64, UEFI)

require conf/machine/include/x86-base.inc

MACHINEOVERRIDES =. "fontis-dev:"

MACHINE = "fontis-dev"

PREFERRED_PROVIDER_virtual/kernel = "linux-fontis"
PREFERRED_PROVIDER_virtual/bootloader = "systemd-boot"

MACHINE_FEATURES += "efi"
MACHINE_FEATURES += "tpm2"
MACHINE_FEATURES += "wifi"
MACHINE_FEATURES += "bluetooth"
MACHINE_FEATURES += "alsa"
MACHINE_FEATURES += "keyboard"
MACHINE_FEATURES += "mouse"
MACHINE_FEATURES += "secureboot"

MACHINE_EXTRA_RDEPENDS += "linux-firmware-iwlwifi linux-firmware-ibt"

KERNEL_IMAGETYPE = "bzImage"

# Serial console for development
SERIAL_CONSOLES = "115200;ttyS0"

# UEFI boot
EFI_PROVIDER = "systemd-boot"

# UEFI Secure Boot key directory (override for production builds)
SECURE_BOOT_KEY_DIR ??= "${LAYERDIR}/../../core/boot/secure-boot/keys"

# Root filesystem: dm-verity protected squashfs
APPEND += "root=/dev/dm-0 ro rootfstype=squashfs console=ttyS0,115200 console=tty1 quiet"

# Image types
IMAGE_FSTYPES += "wic.xz wic.bmap"
WKS_FILE = "fontis-dev.wks"

# TPM for measured boot and key sealing
TSS_PACKAGE = "tpm2-tss"
