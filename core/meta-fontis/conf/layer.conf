BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "fontis"
BBFILE_PATTERN_fontis = "^${LAYERDIR}/"
BBFILE_PRIORITY_fontis = "10"

LAYERDEPENDS_fontis = "core openembedded-layer"
LAYERSERIES_COMPAT_fontis = "kirkstone scarthgap"
