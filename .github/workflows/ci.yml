name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GO_VERSION: "1.25"
  RUST_VERSION: "1.80"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whitespace
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main...HEAD 2>/dev/null || \
            (git fetch --deepen=1 origin main && git diff --check HEAD~1...HEAD)
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check Go formatting
        run: |
          gofmt -l runtime/ 2>&1 | tee /dev/stderr
          if [ -s /dev/stderr ]; then exit 1; fi
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check Rust formatting
        run: if [ -f core/hal/Cargo.toml ]; then cargo fmt --manifest-path core/hal/Cargo.toml --check; else echo "Skipping -- no HAL crate found"; fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: golangci-lint
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "Linting $dir..."
              (cd "$dir" && golangci-lint run ./... --timeout=3m)
            fi
          done
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: clippy
        run: if [ -f core/hal/Cargo.toml ]; then cargo clippy --manifest-path core/hal/Cargo.toml -- -D warnings; else echo "Skipping -- no HAL crate found"; fi

  protoc:
    name: Protobuf check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Regenerate and check diff
        run: |
          make protoc-gen
          git diff --exit-code || (echo "ERROR: Generated Protobuf code is out of date. Run 'make protoc-gen' and commit the changes."; exit 1)

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build runtime services
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go build ./...)
            fi
          done
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build HAL
        run: if [ -f core/hal/Cargo.toml ]; then cargo build --manifest-path core/hal/Cargo.toml; else echo "Skipping -- no HAL crate found"; fi

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run Go unit tests
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go test ./...)
            fi
          done
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Run Rust tests
        run: if [ -f core/hal/Cargo.toml ]; then cargo test --manifest-path core/hal/Cargo.toml; else echo "Skipping -- no HAL crate found"; fi

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: Run govulncheck
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "Scanning $dir..."
              (cd "$dir" && govulncheck ./...)
            fi
          done
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Run cargo-audit
        if: hashFiles('core/hal/Cargo.lock') != ''
        uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: core/hal

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: results
