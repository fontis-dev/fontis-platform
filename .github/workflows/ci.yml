name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GO_VERSION: "1.23"
  RUST_VERSION: "1.86"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace
        run: git diff --check ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check Go formatting
        run: |
          files=$(gofmt -l runtime/)
          if [ -n "$files" ]; then echo "$files"; exit 1; fi
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path core/hal/Cargo.toml --check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tidy Go modules
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go mod tidy)
            fi
          done
      - name: golangci-lint
        run: |
          failed=0
          for dir in runtime/*/; do
            if [ -f "${dir}go.mod" ]; then
              echo "=== Downloading deps & Linting ${dir} ==="
              (cd "${dir}" && go mod download && go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run ./... --timeout=5m) || failed=1
            fi
          done
          exit $failed
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: clippy
        run: cargo clippy --manifest-path core/hal/Cargo.toml -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tidy Go modules
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go mod tidy)
            fi
          done
      - name: Build runtime services
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go build ./...)
            fi
          done
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Generate Cargo.lock
        run: cargo generate-lockfile --manifest-path core/hal/Cargo.toml
      - name: Build HAL
        run: cargo build --manifest-path core/hal/Cargo.toml

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tidy Go modules
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go mod tidy)
            fi
          done
      - name: Run Go unit tests
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go test ./...)
            fi
          done
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Generate Cargo.lock
        run: cargo generate-lockfile --manifest-path core/hal/Cargo.toml
      - name: Run Rust tests
        run: cargo test --manifest-path core/hal/Cargo.toml

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tidy Go modules
        run: |
          for dir in runtime/*/; do
            if [ -f "$dir/go.mod" ]; then
              (cd "$dir" && go mod tidy)
            fi
          done
      - name: Run govulncheck
        run: |
          for dir in runtime/*/; do
            if [ -f "${dir}go.mod" ]; then
              echo "=== govulncheck ${dir} ==="
              (cd "${dir}" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...) || true
            fi
          done
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Generate Cargo.lock
        run: cargo generate-lockfile --manifest-path core/hal/Cargo.toml
      - name: Run cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --manifest-path core/hal/Cargo.toml --no-fetch || echo "cargo-audit found issues (exit code: $?)"

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go, rust
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
