name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 0600 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run Gitleaks
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source . -v

  trivy-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
